<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Digital Auctioneer &mdash; Co-Auctioneer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <h1>🔨 Co-Auctioneer</h1>
    </header>

    <div class="card stage">
      <div class="viewer-badge" id="roomBadge">Connecting...</div>
      <div class="item-name" id="itemName">Loading...</div>
      <div class="bid-label" id="bidLabel">&nbsp;</div>
      <div class="status-display state-idle" id="statusDisplay">Waiting to start</div>
      <div class="bid-count" id="bidCount"></div>

      <label for="bidLabelInput">Current bid (optional, e.g. "$150")</label>
      <div class="bid-stepper">
        <button class="stepper-btn" id="bidDecBtn" type="button" aria-label="Decrease bid">&minus;</button>
        <input type="text" id="bidLabelInput" maxlength="80" placeholder="Leave blank to just say a bid came in" />
        <button class="stepper-btn" id="bidIncBtn" type="button" aria-label="Increase bid">+</button>
      </div>

      <button class="big-bid-button" id="newBidBtn">🔔 New Bid</button>
      <p class="hint" style="margin-top:8px;">Tip: press <strong>Space</strong> to bid too</p>

      <div class="control-row">
        <button class="btn-secondary" id="cancelBtn">Undo / Hold</button>
        <button class="btn-secondary" id="nextItemBtn">Next Item</button>
      </div>

      <button class="mute-btn" id="muteBtn">🔊 Voice Enabled</button>
      <button class="btn-secondary" id="testVoiceBtn" style="margin-top:10px;" hidden>🗣️ Test Voice</button>
      <div class="error" id="cohostError"></div>
    </div>

    <div class="card">
      <button class="settings-toggle" id="settingsToggle">⚙ Item &amp; timing settings</button>
      <div id="settingsPanel" hidden>
        <label for="itemNameInput">What's being bid on?</label>
        <input type="text" id="itemNameInput" maxlength="120" />

        <label>Seconds between calls</label>
        <div class="timing-row">
          <div>
            <label for="onceDelay">Once</label>
            <input type="number" id="onceDelay" min="1" max="30" />
          </div>
          <div>
            <label for="twiceDelay">Twice</label>
            <input type="number" id="twiceDelay" min="1" max="30" />
          </div>
          <div>
            <label for="soldDelay">Sold</label>
            <input type="number" id="soldDelay" min="1" max="30" />
          </div>
        </div>
        <button class="btn-primary" id="saveSettingsBtn">Save Settings</button>
      </div>
    </div>

    <footer class="foot">You're a co-auctioneer with full controls &mdash; the primary host just holds the only copies of the share links.</footer>
  </div>

  <div class="modal-overlay" id="nextItemModal" hidden>
    <div class="modal-box">
      <h2>Next Item</h2>
      <label for="nextItemInput">Search the player pool, or type any name</label>
      <div class="player-search">
        <input type="text" id="nextItemInput" placeholder="Start typing a name..." maxlength="120" autocomplete="off" />
        <div class="player-results" id="nextItemResults" hidden></div>
      </div>
      <div class="control-row">
        <button class="btn-secondary" id="nextItemCancelBtn">Cancel</button>
        <button class="btn-primary" id="nextItemStartBtn" style="margin-top:0;">Start</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cohost.js"></script>
</body>
</html>
